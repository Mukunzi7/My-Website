# Render Blueprint for 70Scholar.
# One-click deploy: https://render.com/deploy?repo=https://github.com/Mukunzi7/My-Website
# Secrets use "sync: false" so Render prompts for them instead of storing them in Git.
# Current deployed host: https://seven0scholar-7cjc.onrender.com
# The actual hostname is the one shown in the Render dashboard.
services:
  - type: web
    name: 70scholar
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /version
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Set privately only after the old live database and files have been backed up
      # and a migration/restore has been verified; never commit the database URL.
      - key: DATABASE_URL
        sync: false
      # Private bucket credentials are server-only. Never put the secret key in Git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: BIRD_API_KEY
        sync: false
      - key: BIRD_FROM
        sync: false
      - key: BIRD_REGION
        sync: false
      # Optional Brevo setup is added manually in Render Environment after
      # creating the sender and API key: EMAIL_PROVIDER=brevo, BREVO_FROM,
      # BREVO_API_KEY. Do not remove existing Bird settings. See BREVO_EMAIL_SETUP.md.

# PERSISTENT STORAGE: DATABASE_URL points to an external PostgreSQL database;
# SUPABASE_* configure a server-only private file bucket. Startup fails if the
# Render PostgreSQL service lacks a verified private bucket. An alternative is a
# paid disk, but attaching one restarts the service
# and DOES NOT migrate its old files. Back up and verify the live data first.
# If using a paid disk instead, uncomment both blocks below:
#
#    plan: starter          # replace "plan: free" above
#    disk:
#      name: data
#      mountPath: /var/data
#      sizeGB: 1
#
# and add these to envVars above:
#      - key: DB_PATH
#        value: /var/data/70scholar.sqlite3
#      - key: UPLOAD_DIR
#        value: /var/data/uploads
#
# See RENDER_DEPLOY.md for the full checklist.
